<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Abstract Pegasus wing-inspired shapes</title><desc id="desc">Four flowing minimal curves in Pegasus blue, turquoise, purple and golden yellow, with generous white space.</desc>
<defs>
 <linearGradient id="blue" x1="150" y1="80" x2="530" y2="440" gradientUnits="userSpaceOnUse"><stop stop-color="#0769B5"/><stop offset="1" stop-color="#268BD2"/></linearGradient>
 <linearGradient id="teal" x1="160" y1="190" x2="590" y2="445" gradientUnits="userSpaceOnUse"><stop stop-color="#1C91B5"/><stop offset="1" stop-color="#5FC1BB"/></linearGradient>
 <linearGradient id="purple" x1="210" y1="265" x2="545" y2="485" gradientUnits="userSpaceOnUse"><stop stop-color="#7953B2"/><stop offset="1" stop-color="#B48DCB"/></linearGradient>
</defs>
<style>
/* Refined wing motion: anchored feathers, a travelling ripple, no layout shift. */
.feather{
  transform-box:view-box;
  animation:feather-ripple 7.2s cubic-bezier(.45,0,.55,1) infinite;
}
.feather--blue{transform-origin:173px 99px;animation-delay:0s}
.feather--teal{transform-origin:167px 222px;animation-delay:-.38s}
.feather--purple{transform-origin:209px 344px;animation-delay:-.76s}
.feather--gold{transform-origin:292px 469px;animation-delay:-1.14s}
.flight-guide{
  transform-box:view-box;
  transform-origin:544px 160px;
  animation:guide-arc 7.2s ease-in-out infinite;
}
@keyframes feather-ripple{
  0%,100%{transform:rotate(0deg) scale(1,1)}
  19%{transform:rotate(-.65deg) scale(1,1.005)}
  44%{transform:rotate(1.65deg) scale(1,1.017)}
  62%{transform:rotate(2.05deg) scale(1,1.019)}
  82%{transform:rotate(-.4deg) scale(1,1.003)}
}
@keyframes guide-arc{
  0%,100%{transform:rotate(0deg) translate(0,0)}
  28%{transform:rotate(-1.5deg) translate(2px,-2px)}
  55%{transform:rotate(-4deg) translate(6px,-5px)}
  80%{transform:rotate(-.7deg) translate(1px,-1px)}
}
@media(prefers-reduced-motion:reduce){
  .feather,.flight-guide{animation:none!important;transform:none!important}
}
</style>
<path class="feather feather--blue" d="M173 99 C240 205 366 218 486 182 C421 228 378 271 357 334 C322 287 255 258 215 207 C183 165 171 122 173 99Z" fill="url(#blue)"/>
<path class="feather feather--teal" d="M167 222 C230 297 302 322 379 322 C446 321 508 287 550 243 C493 324 434 369 354 383 C271 394 208 335 167 222Z" fill="url(#teal)"/>
<path class="feather feather--purple" d="M209 344 C296 405 381 406 453 373 C493 354 518 334 538 304 C521 379 483 423 428 444 C345 472 261 422 209 344Z" fill="url(#purple)"/>
<path class="feather feather--gold" d="M292 469 C358 495 431 472 490 421 C463 480 419 513 371 525 C339 517 311 497 292 469Z" fill="#F4AF2F"/>
<g class="flight-guide"><path d="M544 160 C568 135 590 115 619 102" stroke="#A9D9DF" stroke-width="2" stroke-linecap="round"/>
<circle cx="627" cy="98" r="4" fill="#F4AF2F"/></g><circle cx="568" cy="493" r="3" fill="#68BFC5"/>
</svg>