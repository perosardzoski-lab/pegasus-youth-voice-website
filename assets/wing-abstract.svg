<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Abstract Pegasus wing-inspired shapes</title><desc id="desc">Four flowing minimal curves in Pegasus blue, turquoise, purple and golden yellow, with generous white space.</desc>
<defs>
 <linearGradient id="blue" x1="150" y1="80" x2="530" y2="440" gradientUnits="userSpaceOnUse"><stop stop-color="#0769B5"/><stop offset="1" stop-color="#268BD2"/></linearGradient>
 <linearGradient id="teal" x1="160" y1="190" x2="590" y2="445" gradientUnits="userSpaceOnUse"><stop stop-color="#1C91B5"/><stop offset="1" stop-color="#5FC1BB"/></linearGradient>
 <linearGradient id="purple" x1="210" y1="265" x2="545" y2="485" gradientUnits="userSpaceOnUse"><stop stop-color="#7953B2"/><stop offset="1" stop-color="#B48DCB"/></linearGradient>
</defs>
<style>
/* Approved V1 staggered feather movement, preserved exactly. */
.feather{transform-box:fill-box;transform-origin:20% 22%;animation:feather-breathe 6.4s ease-in-out infinite}
.feather--blue{animation-delay:0s}
.feather--teal{animation-delay:-.42s}
.feather--purple{animation-delay:-.84s}
.feather--gold{animation-delay:-1.26s}
@keyframes feather-breathe{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  24%{transform:translate(0,-2px) rotate(-.8deg)}
  52%{transform:translate(2px,-6px) rotate(2.8deg)}
  77%{transform:translate(0,-1px) rotate(-.6deg)}
}
/* Wind trace: a sequence of short translucent sections fades away behind the dot. */
.wind-trace{fill:none;stroke:#79BDCD;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:18 982}
.wind-moving{display:inline}
.wind-static{display:none}
@media(prefers-reduced-motion:reduce){
 .feather{animation:none!important}
 .wind-moving{display:none!important}
 .wind-static{display:inline!important}
}
</style>
