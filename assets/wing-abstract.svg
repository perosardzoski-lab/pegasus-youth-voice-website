<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" fill="none" role="img" aria-labelledby="title desc">
<title id="title">The Birth of a Voice — Pegasus-inspired flight</title>
<desc id="desc">One golden spark explodes into one hundred irregular firework-like dots. The burst pauses and gathers into a glowing dot, while four original feathers fade into view and sway with the wind. A blue-tailed dot then orbits outside the feathers in a perfect circle.</desc>
<defs>
 <linearGradient id="blue" x1="150" y1="80" x2="530" y2="440" gradientUnits="userSpaceOnUse"><stop stop-color="#0769B5"/><stop offset="1" stop-color="#268BD2"/></linearGradient>
 <linearGradient id="teal" x1="160" y1="190" x2="590" y2="445" gradientUnits="userSpaceOnUse"><stop stop-color="#1C91B5"/><stop offset="1" stop-color="#5FC1BB"/></linearGradient>
 <linearGradient id="purple" x1="210" y1="265" x2="545" y2="485" gradientUnits="userSpaceOnUse"><stop stop-color="#7953B2"/><stop offset="1" stop-color="#B48DCB"/></linearGradient>
 <radialGradient id="wind-glow"><stop stop-color="#F4AF2F" stop-opacity=".32"/><stop offset=".4" stop-color="#F4AF2F" stop-opacity=".12"/><stop offset="1" stop-color="#F4AF2F" stop-opacity="0"/></radialGradient>
 <linearGradient id="long-blue-tail" gradientUnits="userSpaceOnUse" x1="75" y1="250" x2="360" y2="12"><stop offset="0" stop-color="#399FC9" stop-opacity="0"/><stop offset=".28" stop-color="#268FC6" stop-opacity=".10"/><stop offset=".65" stop-color="#218DC5" stop-opacity=".42"/><stop offset="1" stop-color="#137ABD" stop-opacity=".90"/></linearGradient>
</defs>
<style>
/* Pegasus Youth Voice — The Birth of a Voice (firework awakening v2). */
.spark{transform-box:view-box;transform-origin:360px 300px;animation:spark-once .95s ease-out both}
@keyframes spark-once{0%{opacity:0;transform:scale(.15)}30%{opacity:1;transform:scale(1.4)}68%{opacity:1;transform:scale(.90)}100%{opacity:0;transform:scale(.08)}}
/* Hold a true irregular 100-particle burst for over a second, then converge toward the orbit entry point. */
.burst-dot{opacity:0;animation:burst-and-gather 5.15s cubic-bezier(.15,.74,.28,1) both}
@keyframes burst-and-gather{
  0%,12%{opacity:0;transform:translate(0px,0px) scale(.2)}
  18%{opacity:.85;transform:translate(calc(var(--dx)*.38),calc(var(--dy)*.38)) scale(1.35)}
  37%{opacity:1;transform:translate(var(--dx),var(--dy)) scale(1)}
  62%{opacity:.94;transform:translate(calc(var(--dx) + var(--twinkle)),var(--dy)) scale(.96)}
  76%{opacity:.4;transform:translate(calc(var(--dx)*.36),calc(var(--dy)*.36 - 165px)) scale(.6)}
  92%,100%{opacity:0;transform:translate(0px,-288px) scale(.14)}
}
.feather-entrance{opacity:0;transform-box:view-box;transform-origin:360px 300px;animation:feathers-from-background 1.65s cubic-bezier(.19,.7,.25,1) forwards}
.feather-entrance--blue{animation-delay:2.65s}
.feather-entrance--teal{animation-delay:2.86s}
.feather-entrance--purple{animation-delay:3.07s}
.feather-entrance--gold{animation-delay:3.28s}
@keyframes feathers-from-background{0%{opacity:0;transform:translateY(14px) scale(.89)}50%{opacity:.65}100%{opacity:1;transform:translateY(0) scale(1)}}
/* More expressive wind movement, staggered so the feathers never move as one rigid group. */
.feather{transform-box:view-box;animation:feather-wind 8.6s ease-in-out infinite}
.feather--blue{transform-origin:173px 99px;animation-delay:-1.3s}
.feather--teal{transform-origin:167px 222px;animation-delay:-3.5s}
.feather--purple{transform-origin:209px 344px;animation-delay:-5.2s}
.feather--gold{transform-origin:292px 469px;animation-delay:-6.6s}
@keyframes feather-wind{
  0%,100%{transform:rotate(0deg) translate(0,0)}
  16%{transform:rotate(-2.3deg) translate(1px,-4px)}
  36%{transform:rotate(4.6deg) translate(5px,-10px)}
  55%{transform:rotate(.9deg) translate(-1px,-3px)}
  74%{transform:rotate(-3.1deg) translate(-2px,4px)}
  90%{transform:rotate(2.1deg) translate(2px,-5px)}
}
.orbit-system{opacity:0;animation:orbit-enter .7s ease-out 4.60s forwards}
@keyframes orbit-enter{to{opacity:1}}
.orbit-guide{stroke:#7EBFCE;stroke-width:1;stroke-dasharray:2 12;opacity:.12}
.reduced-motion-orbit{display:none}
@media(prefers-reduced-motion:reduce){
 .spark,.burst-dot,.feather-entrance,.feather,.orbit-system{animation:none!important}
 .spark,.burst-dot,.orbit-system{display:none!important}
 .feather-entrance,.feather{opacity:1!important;transform:none!important}
 .reduced-motion-orbit{display:inline!important}
}
</style>
