<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" fill="none" role="img" aria-labelledby="title desc">
<title id="title">The Birth of a Voice — from spark to flight</title>
<desc id="desc">A single golden spark scatters into one hundred uneven dots. Ninety-nine dots settle into four flowing feathers and disappear as the feather shapes fade in. The surviving golden dot circles outside them with a long fading blue trail as the feathers move in the wind.</desc>
<defs>
 <linearGradient id="blue" x1="150" y1="80" x2="530" y2="440" gradientUnits="userSpaceOnUse"><stop stop-color="#0769B5"/><stop offset="1" stop-color="#268BD2"/></linearGradient>
 <linearGradient id="teal" x1="160" y1="190" x2="590" y2="445" gradientUnits="userSpaceOnUse"><stop stop-color="#1C91B5"/><stop offset="1" stop-color="#5FC1BB"/></linearGradient>
 <linearGradient id="purple" x1="210" y1="265" x2="545" y2="485" gradientUnits="userSpaceOnUse"><stop stop-color="#7953B2"/><stop offset="1" stop-color="#B48DCB"/></linearGradient>
 <radialGradient id="spark-glow"><stop stop-color="#F4AF2F" stop-opacity=".31"/><stop offset=".55" stop-color="#F4AF2F" stop-opacity=".13"/><stop offset="1" stop-color="#F4AF2F" stop-opacity="0"/></radialGradient>
 <linearGradient id="trail-blue" gradientUnits="userSpaceOnUse" x1="75" y1="250" x2="360" y2="12"><stop offset="0" stop-color="#349FCB" stop-opacity="0"/><stop offset=".22" stop-color="#2289C3" stop-opacity=".12"/><stop offset=".58" stop-color="#1A84C2" stop-opacity=".46"/><stop offset="1" stop-color="#137BBD" stop-opacity=".95"/></linearGradient>
</defs>
<style>
/* The Birth of a Voice v3 — one spark becomes one hundred dots; 99 become
   feather colour and form, while the original golden spark survives to orbit. */
.burst-dot{opacity:0;animation:particle-to-feather 5.65s cubic-bezier(.19,.73,.25,1) both}
@keyframes particle-to-feather{
  0%,13%{opacity:0;transform:translate(0,0) scale(.12)}
  23%{opacity:1;transform:translate(calc(var(--bx)*.50),calc(var(--by)*.50)) scale(1.35)}
  34%,48%{opacity:1;transform:translate(var(--bx),var(--by)) scale(1)}
  65%{opacity:.95;transform:translate(calc((var(--bx) + var(--fx))*.50),calc((var(--by) + var(--fy))*.50)) scale(1)}
  83%{opacity:.80;transform:translate(var(--fx),var(--fy)) scale(.86)}
  100%{opacity:0;transform:translate(var(--fx),var(--fy)) scale(.18)}
}
.survivor-dot{transform-box:view-box;animation:survivor-journey 5.65s cubic-bezier(.21,.7,.3,1) both}
@keyframes survivor-journey{
  0%,13%{transform:translate(0,0)}
  23%{transform:translate(-48px,-78px)}
  34%,48%{transform:translate(-95px,-125px)}
  67%{transform:translate(-24px,-194px)}
  88%,100%{transform:translate(0,-288px)}
}
.spark-halo{transform-box:fill-box;transform-origin:center;animation:initial-glow .9s ease-out both}
@keyframes initial-glow{0%{opacity:.18;transform:scale(.3)}40%{opacity:1;transform:scale(1.18)}100%{opacity:.6;transform:scale(.9)}}
.feather-entrance{opacity:0;animation:feather-materialize 1.65s ease-out forwards}
.feather-entrance--blue{animation-delay:3.66s}
.feather-entrance--teal{animation-delay:3.79s}
.feather-entrance--purple{animation-delay:3.92s}
.feather-entrance--gold{animation-delay:4.05s}
@keyframes feather-materialize{0%{opacity:0;filter:blur(3px)}55%{opacity:.45}100%{opacity:1;filter:blur(0)}}
.feather{transform-box:view-box;animation:feather-wind 8s cubic-bezier(.44,0,.56,1) infinite}
.feather--blue{transform-origin:173px 99px;animation-delay:-.9s}
.feather--teal{transform-origin:167px 222px;animation-delay:-3s}
.feather--purple{transform-origin:209px 344px;animation-delay:-5s}
.feather--gold{transform-origin:292px 469px;animation-delay:-6.5s}
@keyframes feather-wind{
  0%,100%{transform:rotate(0deg) translate(0,0)}
  17%{transform:rotate(-2deg) translate(1px,-4px)}
  38%{transform:rotate(4.2deg) translate(4px,-9px)}
  59%{transform:rotate(.5deg) translate(-1px,-3px)}
  78%{transform:rotate(-2.8deg) translate(-2px,4px)}
  91%{transform:rotate(1.4deg) translate(2px,-3px)}
}
/* Orbit and trail start when the original dot reaches the top of the circle. */
.orbit-tail{opacity:0;animation:tail-appear .55s ease-out 5.5s forwards}
@keyframes tail-appear{to{opacity:1}}
.static-dot{display:none}
@media(prefers-reduced-motion:reduce){
 .burst-dot,.survivor-dot,.spark-halo,.feather-entrance,.feather,.orbit-tail{animation:none!important}
 .burst-dot,.survivor-dot{display:none!important}
 .feather-entrance,.feather{opacity:1!important;transform:none!important;filter:none!important}
 .orbit-traveller{display:none!important}
 .static-dot{display:inline!important}
}
</style>
